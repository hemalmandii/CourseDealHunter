name: Scrape Courses

on:
  schedule:
    # Run every 6 hours at minute 0
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Course Scraper
        run: |
          echo "Starting Scraper..."
          response=$(curl -s -f -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            https://edzquzoglijjxlslbyll.supabase.co/functions/v1/scrape-coursesity)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          
          echo "Scraper Status: $http_code"
          echo "Scraper Result: $body"

      - name: Resolve Course Details
        run: |
          echo "Starting Resolver..."
          sleep 5  # Wait for scraper to finish inserting
          response=$(curl -s -f -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            https://edzquzoglijjxlslbyll.supabase.co/functions/v1/resolve-details)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          
          echo "Resolver Status: $http_code"
          echo "Resolver Result: $body"
